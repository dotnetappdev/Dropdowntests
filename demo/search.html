<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restriction Search Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../Content/restriction-picker.css">
<script src="../Scripts/restriction-picker.js"></script>
</head>
<body>
<main class="container py-4">
  <h1 class="h3">Search restrictions</h1>
  <p class="text-muted">Open the picker, then search by restriction name or description. Search is case-insensitive and updates as you type; the search box stays at the bottom of the picker.</p>
  <select id="restrictions" multiple data-title="Restrictions on this route" style="display:none">
    <option value="" disabled>Height</option>
    <option value="1" selected data-desc="Check the signed headroom and the measured height on both carriageways. Confirm any diversion with the highway authority.">Low bridge</option>
    <option value="2" data-desc="Overhead lines cross rural routes and are usually lowest at mid-span. The network operator may need to lift the line or switch it off.">Overhead power cables</option>
    <option value="" disabled>Weight</option>
    <option value="3" data-desc="The structure owner must be notified. They may require the load to cross alone, at walking pace and on the centre line.">Weight-restricted bridge</option>
    <option value="" disabled>Ground clearance</option>
    <option value="4" data-desc="Low loaders can ground on the crossing. Call the signaller and get permission before crossing.">Level crossing</option>
  </select>
  <button type="button" class="btn btn-primary" onclick="RestrictionPicker.open('restrictions', 'saveRestrictions')">Open restriction picker</button>
  <span class="rp-picker-error text-danger small" aria-live="polite"></span>
  <button type="button" id="saveRestrictions" value="Save" style="display:none"></button>
  <p id="result" class="mt-3" aria-live="polite">One restriction is selected to start.</p>
</main>
<script>
document.getElementById('saveRestrictions').onclick = function () {
  var selected = Array.prototype.filter.call(document.getElementById('restrictions').options, function (option) {
    return option.selected && option.value;
  }).map(function (option) { return option.text; });
  document.getElementById('result').textContent = selected.length
    ? 'Selected: ' + selected.join(', ')
    : 'No restrictions selected.';
};
</script>
</body>
</html>
